# Netlify settings (these override the dashboard's build settings)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # These values are meant to be public (they appear in the page HTML/JS),
  # so Netlify's secrets scanner should not block the build because of them.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL,PUBLIC_GA_ID,PUBLIC_GSC_VERIFICATION,PUBLIC_BING_VERIFICATION,PUBLIC_WEB3FORMS_KEY"

# Built JS/CSS files have unique names, so they can be cached for a year
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Old-style URLs with .html go to the clean version
[[redirects]]
  from = "/services/*.html"
  to = "/services/:splat"
  status = 301
